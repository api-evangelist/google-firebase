apis:
- name: Firebase Authentication REST API
  description: >-
    The Firebase Authentication REST API enables developers to manage user authentication using email/password,
    phone, and federated identity providers such as Google, Facebook, and Apple. The API supports creating
    and signing in users, verifying tokens, managing user accounts, sending verification emails, and password
    resets through the Identity Toolkit endpoints.
  image: https://kinlane-images.s3.amazonaws.com/shared/apis-json/apis-json-logo.jpg
  humanURL: https://firebase.google.com/docs/auth
  baseURL: https://identitytoolkit.googleapis.com
  tags:
  - Authentication
  - Identity
  - Users
  properties:
  - type: Documentation
    url: https://firebase.google.com/docs/reference/rest/auth
- name: Firebase Hosting REST API
  description: >-
    The Firebase Hosting REST API allows developers to programmatically manage web hosting deployments
    on Firebase. It supports creating new releases, managing site versions, uploading files, configuring
    custom domains, and managing release channels for preview deployments.
  image: https://kinlane-images.s3.amazonaws.com/shared/apis-json/apis-json-logo.jpg
  humanURL: https://firebase.google.com/docs/hosting
  baseURL: https://firebasehosting.googleapis.com
  tags:
  - Deployment
  - Hosting
  - Web
  properties:
  - type: Documentation
    url: https://firebase.google.com/docs/reference/hosting/rest
- name: Firebase Remote Config API
  description: >-
    The Firebase Remote Config API enables developers to change the behavior and appearance of their apps
    without requiring users to download an update. The API allows publishing new Remote Config templates,
    managing conditions and parameters, and rolling back to previous configurations.
  image: https://kinlane-images.s3.amazonaws.com/shared/apis-json/apis-json-logo.jpg
  humanURL: https://firebase.google.com/docs/remote-config
  baseURL: https://firebaseremoteconfig.googleapis.com
  tags:
  - Configuration
  - Feature Flags
  - Remote Config
  properties:
  - type: Documentation
    url: https://firebase.google.com/docs/reference/remote-config/rest
