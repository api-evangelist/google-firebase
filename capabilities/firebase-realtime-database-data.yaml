naftiko: 1.0.0-alpha2
info:
  label: Google Firebase Firebase Realtime Database API — Data
  description: 'Google Firebase Firebase Realtime Database API — Data. 5 operations. Lead operation: Google Firebase Read
    data. Self-contained Naftiko capability covering one Google Firebase business surface.'
  tags:
  - Google Firebase
  - Data
  created: '2026-05-19'
  modified: '2026-05-19'
binds:
- namespace: env
  keys:
    GOOGLE_FIREBASE_API_KEY: GOOGLE_FIREBASE_API_KEY
capability:
  consumes:
  - type: http
    namespace: firebase-realtime-database-data
    baseUri: https://{projectId}-default-rtdb.firebaseio.com
    description: Google Firebase Firebase Realtime Database API — Data business capability. Self-contained, no shared references.
    resources:
    - name: path}.json
      path: /{path}.json
      operations:
      - name: getdata
        method: GET
        description: Google Firebase Read data
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
        inputParameters:
        - name: auth
          in: query
          type: string
          description: Firebase ID token or database secret for authentication
        - name: orderBy
          in: query
          type: string
          description: The child key or priority to order results by
        - name: limitToFirst
          in: query
          type: integer
          description: Limit the number of results returned from the beginning
        - name: limitToLast
          in: query
          type: integer
          description: Limit the number of results returned from the end
        - name: startAt
          in: query
          type: string
          description: Return items starting at the specified value
        - name: endAt
          in: query
          type: string
          description: Return items ending at the specified value
        - name: equalTo
          in: query
          type: string
          description: Return items equal to the specified value
        - name: shallow
          in: query
          type: boolean
          description: Return only the keys at the location (no nested data)
      - name: setdata
        method: PUT
        description: Google Firebase Write data
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
        inputParameters:
        - name: body
          in: body
          type: object
          description: Request body (JSON).
          required: true
      - name: updatedata
        method: PATCH
        description: Google Firebase Update data
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
        inputParameters:
        - name: body
          in: body
          type: object
          description: Request body (JSON).
          required: true
      - name: pushdata
        method: POST
        description: Google Firebase Push data
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
        inputParameters:
        - name: body
          in: body
          type: object
          description: Request body (JSON).
          required: true
      - name: deletedata
        method: DELETE
        description: Google Firebase Delete data
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
  exposes:
  - type: rest
    namespace: firebase-realtime-database-data-rest
    port: 8080
    description: REST adapter for Google Firebase Firebase Realtime Database API — Data. One Spectral-compliant resource per
      consumed operation, prefixed with /v1.
    resources:
    - path: /v1/path-json
      name: path-json
      description: REST surface for path}.json.
      operations:
      - method: GET
        name: getdata
        description: Google Firebase Read data
        call: firebase-realtime-database-data.getdata
        with:
          auth: rest.auth
          orderBy: rest.orderBy
          limitToFirst: rest.limitToFirst
          limitToLast: rest.limitToLast
          startAt: rest.startAt
          endAt: rest.endAt
          equalTo: rest.equalTo
          shallow: rest.shallow
        outputParameters:
        - type: object
          mapping: $.
      - method: PUT
        name: setdata
        description: Google Firebase Write data
        call: firebase-realtime-database-data.setdata
        with:
          body: rest.body
        outputParameters:
        - type: object
          mapping: $.
      - method: PATCH
        name: updatedata
        description: Google Firebase Update data
        call: firebase-realtime-database-data.updatedata
        with:
          body: rest.body
        outputParameters:
        - type: object
          mapping: $.
      - method: POST
        name: pushdata
        description: Google Firebase Push data
        call: firebase-realtime-database-data.pushdata
        with:
          body: rest.body
        outputParameters:
        - type: object
          mapping: $.
      - method: DELETE
        name: deletedata
        description: Google Firebase Delete data
        call: firebase-realtime-database-data.deletedata
        outputParameters:
        - type: object
          mapping: $.
  - type: mcp
    namespace: firebase-realtime-database-data-mcp
    port: 9090
    transport: http
    description: MCP adapter for Google Firebase Firebase Realtime Database API — Data. One tool per consumed operation, routed
      inline through this capability's consumes block.
    tools:
    - name: google-firebase-read-data
      description: Google Firebase Read data
      hints:
        readOnly: true
        destructive: false
        idempotent: true
      call: firebase-realtime-database-data.getdata
      with:
        auth: tools.auth
        orderBy: tools.orderBy
        limitToFirst: tools.limitToFirst
        limitToLast: tools.limitToLast
        startAt: tools.startAt
        endAt: tools.endAt
        equalTo: tools.equalTo
        shallow: tools.shallow
      outputParameters:
      - type: object
        mapping: $.
    - name: google-firebase-write-data
      description: Google Firebase Write data
      hints:
        readOnly: false
        destructive: false
        idempotent: true
      call: firebase-realtime-database-data.setdata
      with:
        body: tools.body
      outputParameters:
      - type: object
        mapping: $.
    - name: google-firebase-update-data
      description: Google Firebase Update data
      hints:
        readOnly: false
        destructive: false
        idempotent: true
      call: firebase-realtime-database-data.updatedata
      with:
        body: tools.body
      outputParameters:
      - type: object
        mapping: $.
    - name: google-firebase-push-data
      description: Google Firebase Push data
      hints:
        readOnly: false
        destructive: false
        idempotent: false
      call: firebase-realtime-database-data.pushdata
      with:
        body: tools.body
      outputParameters:
      - type: object
        mapping: $.
    - name: google-firebase-delete-data
      description: Google Firebase Delete data
      hints:
        readOnly: false
        destructive: true
        idempotent: true
      call: firebase-realtime-database-data.deletedata
      outputParameters:
      - type: object
        mapping: $.
