description: 'FOCUS-aligned FinOps for Firebase: Spark is free with hard caps; Blaze is Pay-As-You-Go
  using underlying GCP service prices and flows through the standard Cloud Billing pipeline. The dominant
  meters are Firestore reads/writes/storage, Realtime Database storage and downloads, Cloud Functions
  invocations and GB-seconds, Cloud Storage, and Hosting transfer.'
