principles:
  - name: Visibility
    description: Enable Cloud Billing detailed export to BigQuery; filter to Firebase services. Use the
      Firebase console's Usage and Billing dashboards per-service to spot trend breaks.
  - name: Allocation
    description: Use one Firebase project per environment/team and tag underlying GCP resources with team
      labels for chargeback. For multi-tenant apps, write a custom dimension into Firestore reads/writes
      via labels in your BigQuery export.
  - name: Optimization
    description: Cache Firestore reads (memoize hot documents); reduce listener fan-out by querying narrower
      paths; deny anonymous Hosting traffic at the CDN edge; right-size Cloud Functions memory; convert
      legacy Cloud Storage default buckets to managed buckets to reduce egress.
  - name: Accountability
    description: Set Cloud Billing budgets per Firebase project at 50/80/100% with Pub/Sub triggers; configure
      project-level spend caps; review monthly which services account for the top 80% of spend and target
      optimization there.
