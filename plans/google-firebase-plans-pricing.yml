specification: API Commons Plans
specificationVersion: '0.1'
schema: https://raw.githubusercontent.com/api-evangelist/interface-research/main/schema/api-commons.yml#/$defs/Plans
provider: Google Firebase
providerId: google-firebase
created: '2026-05-04'
modified: '2026-05-05'
reconciled: true
tags:
  - Mobile Backend
  - Serverless
  - Realtime Database
  - Google Cloud
description: Firebase is offered in two plans - Spark (free, no payment method required) for development
  and Blaze (Pay-As-You-Go) for production. Blaze customers retain the Spark free quotas and pay GCP
  list rates above them. Per-service quotas and overage rates below are taken from the official Firebase
  pricing page.
sources:
  - https://firebase.google.com/pricing
plans:
  - id: google-firebase-spark
    name: Spark
    type: freemium
    description: No-cost plan with generous monthly free quotas. No payment method required. Best for
      development and proofs of concept.
    entries:
      - label: Firestore storage (free)
        description: Cloud Firestore stored data
        name: firestore_storage
        type: quota
        metric: GiB
        limit: 1
        timeFrame: month
        geo: global
        domains:
          - https://firestore.googleapis.com
        unit: 1
        price: '0.00'
        userMultiplied: false
      - label: Firestore document reads
        description: Daily Firestore document reads
        name: firestore_reads
        type: quota
        metric: reads
        limit: 50000
        timeFrame: day
        geo: global
        domains:
          - https://firestore.googleapis.com
        unit: 1
        price: '0.00'
        userMultiplied: false
      - label: Firestore document writes
        description: Daily Firestore document writes
        name: firestore_writes
        type: quota
        metric: writes
        limit: 20000
        timeFrame: day
        geo: global
        domains:
          - https://firestore.googleapis.com
        unit: 1
        price: '0.00'
        userMultiplied: false
      - label: Firestore egress
        description: Monthly egress from Firestore
        name: firestore_egress
        type: quota
        metric: GiB
        limit: 10
        timeFrame: month
        geo: global
        domains:
          - https://firestore.googleapis.com
        unit: 1
        price: '0.00'
        userMultiplied: false
      - label: Realtime Database storage (free)
        description: Realtime Database stored data
        name: rtdb_storage
        type: quota
        metric: GB
        limit: 1
        timeFrame: month
        geo: global
        domains:
          - https://firebasedatabase.googleapis.com
        unit: 1
        price: '0.00'
        userMultiplied: false
      - label: Realtime Database downloads (free)
        description: Monthly Realtime Database downloads
        name: rtdb_downloads
        type: quota
        metric: GB
        limit: 10
        timeFrame: month
        geo: global
        domains:
          - https://firebasedatabase.googleapis.com
        unit: 1
        price: '0.00'
        userMultiplied: false
      - label: Realtime Database concurrent connections (Spark)
        description: Concurrent connections per Realtime Database (Spark cap)
        name: rtdb_connections
        type: quota
        metric: connections
        limit: 100
        timeFrame: usage
        geo: global
        domains:
          - https://firebasedatabase.googleapis.com
        unit: 1
        price: '0.00'
        userMultiplied: false
      - label: Cloud Storage (legacy buckets free)
        description: Free Cloud Storage on the legacy default bucket
        name: storage_free
        type: quota
        metric: GB
        limit: 5
        timeFrame: month
        geo: global
        domains:
          - https://firebasestorage.googleapis.com
        unit: 1
        price: '0.00'
        userMultiplied: false
      - label: Cloud Storage daily download (free)
        description: Free daily download from Cloud Storage
        name: storage_download
        type: quota
        metric: GB
        limit: 1
        timeFrame: day
        geo: global
        domains:
          - https://firebasestorage.googleapis.com
        unit: 1
        price: '0.00'
        userMultiplied: false
      - label: Cloud Functions invocations (free)
        description: Monthly Cloud Functions invocations
        name: functions_invocations
        type: quota
        metric: invocations
        limit: 2000000
        timeFrame: month
        geo: global
        domains:
          - https://cloudfunctions.googleapis.com
        unit: 1
        price: '0.00'
        userMultiplied: false
      - label: Cloud Functions GB-seconds (free)
        description: Monthly Cloud Functions GB-seconds
        name: functions_gb_seconds
        type: quota
        metric: GB-seconds
        limit: 400000
        timeFrame: month
        geo: global
        domains:
          - https://cloudfunctions.googleapis.com
        unit: 1
        price: '0.00'
        userMultiplied: false
      - label: Cloud Functions outbound networking (free)
        description: Monthly egress from Cloud Functions
        name: functions_egress
        type: quota
        metric: GB
        limit: 5
        timeFrame: month
        geo: global
        domains:
          - https://cloudfunctions.googleapis.com
        unit: 1
        price: '0.00'
        userMultiplied: false
      - label: Hosting storage (free)
        description: Hosting site storage
        name: hosting_storage
        type: quota
        metric: GB
        limit: 10
        timeFrame: month
        geo: global
        domains:
          - https://firebasehosting.googleapis.com
        unit: 1
        price: '0.00'
        userMultiplied: false
      - label: Hosting data transfer (free)
        description: Daily Hosting data transfer
        name: hosting_transfer
        type: quota
        metric: MB
        limit: 360
        timeFrame: day
        geo: global
        domains:
          - https://firebasehosting.googleapis.com
        unit: 1
        price: '0.00'
        userMultiplied: false
      - label: Authentication monthly active users (free)
        description: Monthly active authenticated users
        name: auth_mau
        type: quota
        metric: users
        limit: 50000
        timeFrame: month
        geo: global
        domains:
          - https://identitytoolkit.googleapis.com
        unit: 1
        price: '0.00'
        userMultiplied: false
    elements:
      - name: Firestore (Standard edition)
      - name: Realtime Database
      - name: Cloud Storage for Firebase
      - name: Cloud Functions
      - name: Firebase Hosting
      - name: Firebase Authentication
      - name: Cloud Messaging (FCM) - free
      - name: Firebase Crashlytics - free
  - id: google-firebase-blaze
    name: Blaze (Pay-As-You-Go)
    type: pay-as-you-go
    description: Production plan that retains all Spark free quotas and bills above-quota usage at GCP
      list rates. Eligible new accounts receive $300 of Cloud trial credit. Requires a billing account.
    entries:
      - label: Realtime Database storage overage
        description: Per-GB-month above the 1 GB free
        name: rtdb_storage_overage
        type: metered
        metric: GB
        limit: -1
        timeFrame: month
        geo: global
        domains:
          - https://firebasedatabase.googleapis.com
        unit: 1
        price: '5.00'
        userMultiplied: false
      - label: Realtime Database download overage
        description: Per-GB above the 10 GB/month free
        name: rtdb_download_overage
        type: metered
        metric: GB
        limit: -1
        timeFrame: month
        geo: global
        domains:
          - https://firebasedatabase.googleapis.com
        unit: 1
        price: '1.00'
        userMultiplied: false
      - label: Realtime Database concurrent connections (Blaze)
        description: Concurrent connections per Realtime Database
        name: rtdb_connections_blaze
        type: quota
        metric: connections
        limit: 200000
        timeFrame: usage
        geo: global
        domains:
          - https://firebasedatabase.googleapis.com
        unit: 1
        price: included
        userMultiplied: false
      - label: Cloud Storage overage
        description: Per-GB-month above the 5 GB free (legacy buckets)
        name: storage_overage
        type: metered
        metric: GB
        limit: -1
        timeFrame: month
        geo: global
        domains:
          - https://firebasestorage.googleapis.com
        unit: 1
        price: '0.026'
        userMultiplied: false
      - label: Cloud Storage download overage
        description: Per-GB above the 1 GB/day free download
        name: storage_download_overage
        type: metered
        metric: GB
        limit: -1
        timeFrame: day
        geo: global
        domains:
          - https://firebasestorage.googleapis.com
        unit: 1
        price: '0.12'
        userMultiplied: false
      - label: Cloud Functions invocation overage
        description: Per-million invocations above the 2M/month free
        name: functions_invocations_overage
        type: metered
        metric: invocations
        limit: -1
        timeFrame: month
        geo: global
        domains:
          - https://cloudfunctions.googleapis.com
        unit: 1000000
        price: '0.40'
        userMultiplied: false
      - label: Cloud Functions egress overage
        description: Per-GB above the 5 GB/month free
        name: functions_egress_overage
        type: metered
        metric: GB
        limit: -1
        timeFrame: month
        geo: global
        domains:
          - https://cloudfunctions.googleapis.com
        unit: 1
        price: '0.12'
        userMultiplied: false
      - label: Hosting storage overage
        description: Per-GB-month above the 10 GB free
        name: hosting_storage_overage
        type: metered
        metric: GB
        limit: -1
        timeFrame: month
        geo: global
        domains:
          - https://firebasehosting.googleapis.com
        unit: 1
        price: '0.026'
        userMultiplied: false
      - label: Hosting transfer overage
        description: Per-GB above the 360 MB/day free
        name: hosting_transfer_overage
        type: metered
        metric: GB
        limit: -1
        timeFrame: day
        geo: global
        domains:
          - https://firebasehosting.googleapis.com
        unit: 1
        price: '0.15'
        userMultiplied: false
      - label: Other GCP services
        description: Above-quota usage of any underlying GCP service is billed at the standard GCP list
          price
        name: other_gcp
        type: metered
        metric: varies
        limit: -1
        timeFrame: usage
        geo: global
        domains:
          - https://cloud.google.com
        unit: 1
        price: see GCP pricing page
        userMultiplied: false
    elements:
      - name: All Spark services
      - name: Above-quota billing at GCP rates
      - name: $300 Cloud trial credit (eligible accounts)
      - name: Firebase Test Lab beyond free
      - name: Vertex AI / ML Kit features
      - name: Higher RTDB connection ceiling (200K)
maintainers:
  - FN: Kin Lane
    email: kin@apievangelist.com
